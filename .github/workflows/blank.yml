name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
      - '*.*.*'
  pull_request:

jobs:
  build:
    name: "Build Flatpak"
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: lucaschessR6.flatpak
          manifest-path: io.github.lukasmonk.lucaschessR6.yml

      - name: Upload temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: lucaschessR6.flatpak

  release:
    name: "Publish Release"
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: flatpak-bundle

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: lucaschessR6.flatpak
          generate_release_notes: true
          body: |
            Flatpak bundle for Lucas Chess R6

            ```bash
            flatpak install --user lucaschessR6.flatpak
            flatpak run io.github.lukasmonk.lucaschessR6
            ```
