id: io.github.lukasmonk.lucaschessR6
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: lucaschess

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  # Read-only access to cursor/icon themes and GTK's settings.ini --
  # only needed if QT_QPA_PLATFORM=xcb has to stay forced (see the
  # cursor-theme comment block in lucaschess-wrapper.sh). Harmless to
  # leave granted either way.
  - --filesystem=xdg-config/gtk-3.0:ro
  - --filesystem=xdg-data/icons:ro
  - --filesystem=~/.icons:ro

cleanup:
  - '*.a'
  - '*.la'
  - /include
  - /lib/pkgconfig
  - /share/doc
  - /share/man

modules:
  - name: lucaschess
    buildsystem: simple
    build-commands:
      # Diagnostic: if the cp below ever fails again, this shows exactly
      # what the build-host's 7z actually put on disk, in the build log.
      - echo "--- post-extract build dir ---"; find . -maxdepth 2 | sort; echo "-------------------------------"
      # Locate the extracted top-level dir instead of hardcoding
      # "LucasChessR" -- older p7zip builds on some CI runners have been
      # seen to mangle/drop the leading path entry of modern solid
      # LZMA2+BCJ .7z archives even while reporting success.
      - |
        set -eu
        # Find wherever the archive actually put "bin/", up to 2 levels
        # deep, and use its parent as the source root -- works whether
        # it's "LucasChessR/bin" as expected or something p7zip mangled.
        SRC_DIR="$(find . -mindepth 2 -maxdepth 2 -type d -name bin -printf '%h\n' | head -1)"
        if [ -z "$SRC_DIR" ]; then
          SRC_DIR="."
        fi
        echo "Using extracted source dir: $SRC_DIR"
        install -d /app/share/lucaschess
        cp -a "$SRC_DIR/bin" /app/share/lucaschess/bin
        cp -a "$SRC_DIR/Resources" /app/share/lucaschess/Resources
      - chmod -R +x /app/share/lucaschess/bin/OS/linux/Engines/
      - chmod +x /app/share/lucaschess/bin/LucasR /app/share/lucaschess/bin/setup_linux
      # The frozen build bundles its own (older) libfontconfig.so.1 next
      # to the executable, which PyInstaller's rpath ($ORIGIN) makes it
      # prefer over the runtime's copy. That old copy can't parse the
      # newer fontconfig schema Flatpak auto-generates for host font
      # access (reset-dirs/remap-dir/salt/as-path -- fontconfig 2.14+),
      # producing parse warnings/errors at startup. Delete it so the
      # dynamic linker falls back to org.kde.Platform's fontconfig,
      # which understands its own generated config. Fontconfig's public
      # ABI is stable across versions, so this is a safe swap (unlike
      # the Qt private-symbol issue the BaseApp build had).
      - rm -f /app/share/lucaschess/bin/_internal/libfontconfig.so.1
      - install -Dm755 lucaschess-wrapper.sh /app/bin/lucaschess
      - install -Dm644 io.github.lukasmonk.lucaschessR6.desktop /app/share/applications/io.github.lukasmonk.lucaschessR6.desktop
      - install -Dm644 io.github.lukasmonk.lucaschessR6.metainfo.xml /app/share/metainfo/io.github.lukasmonk.lucaschessR6.metainfo.xml
      - install -Dm644 io.github.lukasmonk.lucaschessR6.png /app/share/icons/hicolor/64x64/apps/io.github.lukasmonk.lucaschessR6.png
    sources:
      # NOTE: extracting a .7z source requires p7zip (7z/7za) on the
      # *build host* -- install it before running flatpak-builder, e.g.
      # `sudo dnf install p7zip p7zip-plugins` on Fedora.
      # No x-checker-data here -- upstream doesn't expose a stable feed
      # for these release assets. Check https://lucaschess.pythonanywhere.com/downloads
      # by hand for new versions and bump the url/sha256 together.
      - type: archive
        url: https://github.com/lukasmonk/lucaschessR6/releases/download/R6.1.3/LucasChessR6_1_4_LINUX_PORTABLE.7z
        sha256: c4299bd42cc2aa541798a763524da6fef669c00056db62edc690e421adca6041
      - type: file
        path: lucaschess-wrapper.sh
      - type: file
        path: io.github.lukasmonk.lucaschessR6.desktop
      - type: file
        path: io.github.lukasmonk.lucaschessR6.metainfo.xml
      - type: file
        path: io.github.lukasmonk.lucaschessR6.png
