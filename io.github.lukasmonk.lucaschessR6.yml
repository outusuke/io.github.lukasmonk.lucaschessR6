id: io.github.lukasmonk.lucaschessR6
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: lucaschess

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network

cleanup:
  - '*.a'
  - '*.la'
  - /include
  - /lib/pkgconfig
  - /share/doc
  - /share/man

modules:
  - name: lucaschess
    buildsystem: simple
    build-commands:
      # LucasChessR/ is the top-level dir inside the upstream .7z release.
      - install -d /app/share/lucaschess
      - cp -a LucasChessR/bin /app/share/lucaschess/bin
      - cp -a LucasChessR/Resources /app/share/lucaschess/Resources
      - chmod -R +x /app/share/lucaschess/bin/OS/linux/Engines/
      - chmod +x /app/share/lucaschess/bin/LucasR /app/share/lucaschess/bin/setup_linux
      - install -Dm755 lucaschess-wrapper.sh /app/bin/lucaschess
      - install -Dm644 io.github.lukasmonk.lucaschessR6.desktop /app/share/applications/io.github.lukasmonk.lucaschessR6.desktop
      - install -Dm644 io.github.lukasmonk.lucaschessR6.metainfo.xml /app/share/metainfo/io.github.lukasmonk.lucaschessR6.metainfo.xml
      - install -Dm644 io.github.lukasmonk.lucaschessR6.png /app/share/icons/hicolor/64x64/apps/io.github.lukasmonk.lucaschessR6.png
    sources:
      # NOTE: extracting a .7z source requires p7zip (7z/7za) on the
      # *build host* -- install it before running flatpak-builder, e.g.
      # `sudo dnf install p7zip p7zip-plugins` on Fedora.
      # No x-checker-data here -- upstream doesn't expose a stable feed
      # for these release assets. Check https://lucaschess.pythonanywhere.com/downloads
      # by hand for new versions and bump the url/sha256 together.
      - type: archive
        url: https://github.com/lukasmonk/lucaschessR6/releases/download/R6.1.3/LucasChessR6_1_4_LINUX_PORTABLE.7z
        sha256: c4299bd42cc2aa541798a763524da6fef669c00056db62edc690e421adca6041
      - type: file
        path: lucaschess-wrapper.sh
      - type: file
        path: io.github.lukasmonk.lucaschessR6.desktop
      - type: file
        path: io.github.lukasmonk.lucaschessR6.metainfo.xml
      - type: file
        path: io.github.lukasmonk.lucaschessR6.png
