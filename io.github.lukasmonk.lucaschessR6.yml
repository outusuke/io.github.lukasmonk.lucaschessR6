id: io.github.lukasmonk.lucaschessR6
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: lucaschess

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network

cleanup:
  - '*.a'
  - '*.la'
  - /include
  - /lib/pkgconfig
  - /share/doc
  - /share/man

modules:
  - name: lucaschess
    buildsystem: simple
    build-commands:

      - echo "--- post-extract build dir ---"; find . -maxdepth 2 | sort; echo "-------------------------------"
      - |
        set -eu
        SRC_DIR="$(find . -mindepth 2 -maxdepth 2 -type d -name bin -printf '%h\n' | head -1)"
        if [ -z "$SRC_DIR" ]; then
          SRC_DIR="."
        fi
        echo "Using extracted source dir: $SRC_DIR"
        install -d /app/share/lucaschess
        cp -a "$SRC_DIR/bin" /app/share/lucaschess/bin
        cp -a "$SRC_DIR/Resources" /app/share/lucaschess/Resources
      - chmod -R +x /app/share/lucaschess/bin/OS/linux/Engines/
      - chmod +x /app/share/lucaschess/bin/LucasR /app/share/lucaschess/bin/setup_linux
      - rm -f /app/share/lucaschess/bin/_internal/libfontconfig.so.1
      - install -Dm755 lucaschess-wrapper.sh /app/bin/lucaschess
      - install -Dm644 io.github.lukasmonk.lucaschessR6.desktop /app/share/applications/io.github.lukasmonk.lucaschessR6.desktop
      - install -Dm644 io.github.lukasmonk.lucaschessR6.metainfo.xml /app/share/metainfo/io.github.lukasmonk.lucaschessR6.metainfo.xml
      - install -Dm644 io.github.lukasmonk.lucaschessR6.png /app/share/icons/hicolor/64x64/apps/io.github.lukasmonk.lucaschessR6.png
    sources:
      - type: archive
        url: https://github.com/lukasmonk/lucaschessR6/releases/download/R6.1.4/LucasChessR6_1_4_LINUX_PORTABLE.7z
        sha256: c4299bd42cc2aa541798a763524da6fef669c00056db62edc690e421adca6041
      - type: file
        path: lucaschess-wrapper.sh
      - type: file
        path: io.github.lukasmonk.lucaschessR6.desktop
      - type: file
        path: io.github.lukasmonk.lucaschessR6.metainfo.xml
      - type: file
        path: io.github.lukasmonk.lucaschessR6.png
